# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
# CSpell configuration
# Documentation: https://cspell.org/docs/Configuration

version: '0.2'

import:
  - cspell-config-spellbookx
  # Italian dictionary, enabled only for the Italian translations below.
  - '@cspell/dict-it-it/cspell-ext.json'

# Project word lists, one word per line. Paths are relative to this file.
dictionaryDefinitions:
  # English words missing from the default dictionaries.
  - name: project-english
    path: ./cspell/english.txt
    addWords: true
  # Italian words missing from the Italian dictionary.
  - name: project-italian
    path: ./cspell/italian.txt
    addWords: true
  # Acronyms, product names, transaction codes, and other technical terms
  # from tools and course topics, in any language.
  - name: project-technical
    path: ./cspell/technical.txt
    addWords: true

dictionaries:
  - project-english
  - project-technical

overrides:
  - filename:
      - '**/messages/it.json'
      - '**/.config/cspell/italian.txt'
    language: en,it
    dictionaries:
      - project-italian
  # Course lessons: skip code (fenced blocks and inline code), which is full
  # of identifiers in other languages.
  - filename: '**/content/**/*.md'
    ignoreRegExpList:
      - '/^\s*```[\s\S]*?^\s*```/gm'
      - '/`[^`\n]+`/g'
  - filename: '**/content/**/*.it.md'
    language: en,it
    dictionaries:
      - project-italian

ignorePaths:
  - .agents/**
  - .claude/**
  - .openhands/**
  - skills-lock.json
  - LICENSE
